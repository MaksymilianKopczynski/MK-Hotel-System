<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grafik Pokoi - Recepcja</title>
    
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar-scheduler@6.1.11/index.global.min.js'></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f7f6;
        }
        #calendar {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .fc-event {
            cursor: pointer;
            border: none;
        }
        .fc-timeline-slot-today {
            background-color: #fffae6 !important; 
        }
        #jump-date {
            padding: 6px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
            background-color: #fff;
        }
        /* MODAL STYLES */
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000; 
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .modal-close {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #555;
            font-weight: bold;
        }
        .modal-close:hover { color: #000; }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Recepcja - Grafik Pokoi</h2>
    
    <div id='calendar'></div>

    <div id="reservationModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" id="closeModalBtn">&times;</span>
            <h3 id="modalGuestName" style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;"></h3>
            <p><strong>Status:</strong> <span id="modalStatus"></span></p>
            <p><strong>Przyjazd:</strong> <span id="modalCheckIn"></span></p>
            <p><strong>Wyjazd:</strong> <span id="modalCheckOut"></span></p>
            
            <p><strong>Numer Rezerwacji:</strong> <span id="modalResNumber"></span></p>
            
            <div style="text-align: right; margin-top: 20px;">
                <button style="padding: 8px 15px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px;">Edytuj Rezerwację</button>
            </div>
        </div>
    </div>

    <div id="newReservationModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" id="closeNewModalBtn">&times;</span>
            <h3 style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;">Nowa Rezerwacja</h3>
            
            <form id="newReservationForm">
                <p><strong>Pokój ID:</strong> <input type="text" id="newRoomId" name="room_id" readonly style="border:none; background:transparent; font-weight:bold;"></p>
                <p><strong>Przyjazd:</strong> <input type="date" id="newCheckIn" name="start_date" readonly style="border:none; background:transparent; font-weight:bold;"></p>
                <p><strong>Wyjazd:</strong> <input type="date" id="newCheckOut" name="end_date" readonly style="border:none; background:transparent; font-weight:bold;"></p>
                
                <p style="color: #666; font-size: 14px;"><em>(Tutaj w kolejnym kroku dodamy pola dla gościa: Imię, Nazwisko, Cena itp.)</em></p>
                
                <div style="text-align: right; margin-top: 20px;">
                    <button type="button" style="padding: 8px 15px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px;">Zapisz Rezerwację</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');

            // CUSTOM FUNCTION: Centers the horizontal scrollbar on a specific date
            function centerView(dateString) {
                setTimeout(function() {
                    var slot = document.querySelector('th[data-date^="' + dateString + '"]');
                    if (!slot) return;
                    
                    var scrollers = document.querySelectorAll('.fc-scroller');
                    var mainScroller = null;
                    for (var i = 0; i < scrollers.length; i++) {
                        if (scrollers[i].scrollWidth > scrollers[i].clientWidth) {
                            mainScroller = scrollers[i];
                            break;
                        }
                    }

                    if (mainScroller) {
                        var slotRect = slot.getBoundingClientRect();
                        var scrollerRect = mainScroller.getBoundingClientRect();
                        
                        var offset = (slotRect.left - scrollerRect.left) + mainScroller.scrollLeft;
                        var centerPosition = offset - (scrollerRect.width / 2) + (slotRect.width / 2);

                        mainScroller.scrollTo({ left: centerPosition, behavior: 'smooth' });
                    }
                }, 150); 
            }

            var calendar = new FullCalendar.Calendar(calendarEl, {
                // DEFINING CUSTOM BUTTONS
                customButtons: {
                    customTodayButton: {
                        text: 'Wróć do dzisiaj',
                        click: function() {
                            var today = new Date();
                            var year = today.getFullYear();
                            var month = String(today.getMonth() + 1).padStart(2, '0');
                            var day = String(today.getDate()).padStart(2, '0');
                            var dateString = year + '-' + month + '-' + day;

                            calendar.gotoDate(today);

                            var jumpDateInput = document.getElementById('jump-date');
                            if (jumpDateInput) {
                                jumpDateInput.value = dateString;
                            }

                            centerView(dateString);
                        }
                    },
                    customPrevButton: {
                        icon: 'chevron-left', 
                        click: function() {
                            var jumpInput = document.getElementById('jump-date');
                            if (jumpInput && jumpInput.value) {
                                var currentDate = new Date(jumpInput.value);
                                currentDate.setDate(currentDate.getDate() - 7);
                                calendar.gotoDate(currentDate);
                            }
                        }
                    },
                    customNextButton: {
                        icon: 'chevron-right', 
                        click: function() {
                            var jumpInput = document.getElementById('jump-date');
                            if (jumpInput && jumpInput.value) {
                                var currentDate = new Date(jumpInput.value);
                                currentDate.setDate(currentDate.getDate() + 7);
                                calendar.gotoDate(currentDate);
                            }
                        }
                    }
                },

                // DEFINING CUSTOM VIEWS
                views: {
                    symmetricTimeline: {
                        type: 'resourceTimeline',
                        visibleRange: function(currentDate) {
                            var start = new Date(currentDate.valueOf());
                            start.setDate(start.getDate() - 15);
                            var end = new Date(currentDate.valueOf());
                            end.setDate(end.getDate() + 16);
                            return { start: start, end: end };
                        },
                        
                        slotDuration: { hours: 24 }, 
                        snapDuration: { hours: 1 },  
                        
                        titleFormat: { year: 'numeric', month: 'short', day: 'numeric' },
                        
                        slotLabelFormat: [
                            { month: 'long', year: 'numeric' },
                            { weekday: 'short', day: 'numeric' }
                        ]
                    }
                },
                
                initialView: 'symmetricTimeline',
                
                headerToolbar: {
                    left: 'customPrevButton,customNextButton customTodayButton', 
                    center: 'title',
                    right: '' 
                },
                
                locale: 'pl',
                displayEventTime: false, 
                resourceAreaHeaderContent: 'Pokoje',
                resourceAreaWidth: '15%',
                stickyHeaderDates: true,
                height: 'auto',
                
                selectable: true, 
                
                // ACTION TRIGGERED AFTER DRAGGING AND SELECTING DATES
                select: function(info) {
                    var startDate = info.startStr.split('T')[0];
                    var endDate = info.endStr.split('T')[0];
                    var roomId = info.resource.id;

                    // Populate the inputs in the new reservation modal
                    document.getElementById('newRoomId').value = roomId;
                    document.getElementById('newCheckIn').value = startDate;
                    document.getElementById('newCheckOut').value = endDate;

                    // Show the new reservation modal
                    document.getElementById('newReservationModal').style.display = 'flex';
                    
                },

                // ACTION TRIGGERED WHEN CLICKING AN EXISTING RESERVATION TILE
                eventClick: function(info) {
                    var props = info.event.extendedProps;
                    
                    // Populate modal fields with data from Django
                    document.getElementById('modalGuestName').innerText = props.guest_name;
                    document.getElementById('modalStatus').innerText = props.status;
                    document.getElementById('modalCheckIn').innerText = props.check_in;
                    document.getElementById('modalCheckOut').innerText = props.check_out;
                    
                    // CRITICAL FIX: Looking for exactly "modalResNumber"
                    document.getElementById('modalResNumber').innerText = props.reservation_number;
                    
                    // Show the modal
                    document.getElementById('reservationModal').style.display = 'flex';
                },

                // Listener triggered whenever the calendar date changes
                datesSet: function(info) {
                    var centerDate = info.view.calendar.getDate();
                    var year = centerDate.getFullYear();
                    var month = String(centerDate.getMonth() + 1).padStart(2, '0');
                    var day = String(centerDate.getDate()).padStart(2, '0');
                    var dateString = year + '-' + month + '-' + day;

                    var jumpDateInput = document.getElementById('jump-date');
                    if (jumpDateInput) {
                        jumpDateInput.value = dateString;
                    }

                    centerView(dateString);
                },

                // Injecting Django Context Data
                resources: {{ resources_json|safe }},
                events: {{ events_json|safe }}
            });

            calendar.render();

            // Injecting the custom date picker into the right toolbar chunk
            var rightToolbar = document.querySelector('.fc-toolbar-chunk:nth-child(3)');
            if (rightToolbar && !document.getElementById('jump-date')) {
                rightToolbar.innerHTML = '<input type="date" id="jump-date" title="Skocz do daty">';
                
                var jumpDateInput = document.getElementById('jump-date');
                jumpDateInput.addEventListener('change', function() {
                    if (this.value) {
                        calendar.gotoDate(this.value);
                    }
                });
            }

            // MODAL CLOSE LOGIC (Safely placed inside DOMContentLoaded)
            document.getElementById('closeModalBtn').addEventListener('click', function() {
                document.getElementById('reservationModal').style.display = 'none';
            });

            // Closing the new reservation modal
            document.getElementById('closeNewModalBtn').addEventListener('click', function() {
                document.getElementById('newReservationModal').style.display = 'none';
            });

            // Closing any modal by clicking on the dark overlay background
            window.addEventListener('click', function(event) {
                var detailsModal = document.getElementById('reservationModal');
                var newModal = document.getElementById('newReservationModal');
                
                if (event.target == detailsModal) {
                    detailsModal.style.display = 'none';
                }
                if (event.target == newModal) {
                    newModal.style.display = 'none';
                }
            });

        }); // END OF DOMContentLoaded
    </script>

</body>
</html>
